<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión - Zapping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .form-control { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    .form-control:focus { background: #0d1117; color: #e6edf3; border-color: #58a6ff; box-shadow: none; }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; }
    .btn-primary:hover { background: #388bfd; border-color: #388bfd; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h4 class="mb-1 text-center">Zapping</h4>
    <p class="text-center text-secondary small mb-4">Live Streaming</p>
    <div id="alert" class="alert d-none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <hr class="border-secondary" />
    <p class="text-center mb-0 small">
      ¿No tenés cuenta? <a href="/register.html" class="text-info">Crear cuenta</a>
    </p>
  </div>

  <script src="/config.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/player.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert d-none';

      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${window.API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/player.html';
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.error || 'Credenciales incorrectas';
        }
      } catch (_) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'Error de conexión';
      }
    });
  </script>
</body>
</html>
