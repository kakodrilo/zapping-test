<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player - Zapping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .navbar { background: #161b22; border-bottom: 1px solid #30363d; }

    .video-wrapper {
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    /* Fullscreen: video fills the entire screen, controls float above as overlay */
    .video-wrapper:fullscreen,
    .video-wrapper:-webkit-full-screen {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 0;
      background: #000;
    }
    .video-wrapper:fullscreen video,
    .video-wrapper:-webkit-full-screen video {
      width: 100%;
      height: 100%;
      aspect-ratio: unset;
      object-fit: contain;
    }
    /* Controls are hidden by default in fullscreen, overlaid at the bottom */
    .video-wrapper:fullscreen .player-controls,
    .video-wrapper:-webkit-full-screen .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: none;
      background: rgba(22, 27, 34, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    /* Controls appear on mouse activity */
    .video-wrapper:fullscreen.controls-visible .player-controls,
    .video-wrapper:-webkit-full-screen.controls-visible .player-controls {
      opacity: 0.8;
      pointer-events: auto;
    }
    /* Hide cursor when controls are not visible in fullscreen */
    .video-wrapper:fullscreen:not(.controls-visible),
    .video-wrapper:-webkit-full-screen:not(.controls-visible) {
      cursor: none;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      background: #000;
    }

    /* ── Control bar ── */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #161b22;
      border-top: 1px solid #30363d;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #e6edf3;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      display: flex;
      align-items: center;
      border-radius: 4px;
    }
    .ctrl-btn:hover { color: #58a6ff; background: #21262d; }
    .ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; display: block; }

    /* ── Volume group: button + slider appears on hover ── */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .volume-slider-wrap {
      display: flex;
      align-items: center;
      width: 0;
      overflow: hidden;
      opacity: 0;
      transition: width 0.18s ease, opacity 0.18s ease;
    }
    .volume-group:hover .volume-slider-wrap,
    .volume-group:focus-within .volume-slider-wrap {
      width: 76px;
      opacity: 1;
    }
    .volume-slider {
      width: 72px;
      accent-color: #1f6feb;
      cursor: pointer;
    }

    /* ── Live indicator (pushed right) ── */
    .live-indicator {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 6px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #da3633;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .live-dot.paused { background: #8b949e; }

    /* ── Stream list ── */
    .stream-card {
      background: #161b22;
      border: 1px solid #30363d;
      cursor: pointer;
      transition: border-color 0.2s;
      border-radius: 6px;
    }
    .stream-card:hover { border-color: #58a6ff; }
    .stream-card.active { border-color: #1f6feb; background: #1c2a3a; }
    .badge-live {
      background: #da3633;
      color: #fff;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <nav class="navbar px-4 py-2 d-flex justify-content-between align-items-center">
    <span class="fw-bold fs-5">Zapping Live</span>
    <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Salir</button>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="video-wrapper" id="videoWrapper">
          <video id="video" playsinline muted></video>
          <div class="player-controls">

            <!-- Play / Pause -->
            <button id="playPauseBtn" class="ctrl-btn" title="Pausar">
              <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>

            <!-- Mute / Unmute + volume slider on hover -->
            <div class="volume-group">
              <button id="muteBtn" class="ctrl-btn" title="Silenciar">
                <!-- speaker muted (starts muted) -->
                <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <div class="volume-slider-wrap">
                <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="0" />
              </div>
            </div>

            <!-- Live indicator -->
            <div class="live-indicator">
              <div id="liveDot" class="live-dot"></div>
              EN VIVO
            </div>

            <!-- Fullscreen -->
            <button id="fullscreenBtn" class="ctrl-btn" title="Pantalla completa">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>

          </div>
        </div>
        <div class="mt-3">
          <h5 id="streamTitle" class="mb-1">Seleccioná un canal</h5>
          <p id="streamDesc" class="text-secondary small mb-0"></p>
        </div>
      </div>
      <div class="col-lg-4">
        <h6 class="text-secondary mb-3 text-uppercase" style="font-size:.75rem; letter-spacing:.05em;">Canales disponibles</h6>
        <div id="streamList"></div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const video        = document.getElementById('video');
    const videoWrapper = document.getElementById('videoWrapper');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn      = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const liveDot      = document.getElementById('liveDot');
    const fullscreenBtn= document.getElementById('fullscreenBtn');

    const ICON_PAUSE = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    const ICON_PLAY  = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;
    const ICON_VOL   = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
    const ICON_MUTED = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
    const ICON_FS_ON = `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
    const ICON_FS_OFF= `<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`;

    let hls           = null;
    let streams       = [];
    let currentStream = null;
    let lastVolume    = 0.7;

    // ── Mute / Volume ──────────────────────────────────────────────
    function syncMuteUI() {
      const muted = video.muted || video.volume === 0;
      muteBtn.innerHTML = muted ? ICON_MUTED : ICON_VOL;
      muteBtn.title     = muted ? 'Activar sonido' : 'Silenciar';
      volumeSlider.value = muted ? 0 : video.volume;
    }

    muteBtn.addEventListener('click', () => {
      if (video.muted || video.volume === 0) {
        video.muted  = false;
        video.volume = lastVolume;
      } else {
        lastVolume   = video.volume;
        video.muted  = true;
      }
      syncMuteUI();
    });

    volumeSlider.addEventListener('input', () => {
      const val = parseFloat(volumeSlider.value);
      if (val > 0) lastVolume = val;
      video.muted  = val === 0;
      video.volume = val;
      syncMuteUI();
    });

    // ── Play / Pause ───────────────────────────────────────────────
    playPauseBtn.addEventListener('click', () => {
      if (video.paused) {
        // Snap back to live edge: destroy and re-create HLS
        if (currentStream) playStream(currentStream);
      } else {
        video.pause();
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.innerHTML = ICON_PAUSE;
      playPauseBtn.title     = 'Pausar';
      liveDot.classList.remove('paused');
    });
    video.addEventListener('pause', () => {
      playPauseBtn.innerHTML = ICON_PLAY;
      playPauseBtn.title     = 'Reanudar';
      liveDot.classList.add('paused');
    });

    // ── Fullscreen ─────────────────────────────────────────────────
    let hideCtrlsTimer = null;

    function showFsControls() {
      videoWrapper.classList.add('controls-visible');
      clearTimeout(hideCtrlsTimer);
      hideCtrlsTimer = setTimeout(() => {
        videoWrapper.classList.remove('controls-visible');
      }, 3000);
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen).call(videoWrapper);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });

    function onFullscreenChange() {
      const inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenBtn.innerHTML = inFS ? ICON_FS_OFF : ICON_FS_ON;
      fullscreenBtn.title     = inFS ? 'Salir de pantalla completa' : 'Pantalla completa';

      if (inFS) {
        videoWrapper.addEventListener('mousemove', showFsControls);
        showFsControls(); // show briefly on enter
      } else {
        videoWrapper.removeEventListener('mousemove', showFsControls);
        clearTimeout(hideCtrlsTimer);
        videoWrapper.classList.remove('controls-visible');
      }
    }

    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    // ── Token refresh ──────────────────────────────────────────────
    setInterval(async () => {
      try {
        const res = await fetch(`${window.API_BASE}/api/refresh`, {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('token', data.token);
        } else {
          redirectLogin();
        }
      } catch (_) {}
    }, 50 * 60 * 1000);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });

    // ── Streams ────────────────────────────────────────────────────
    async function loadStreams() {
      try {
        const res = await fetch(`${window.API_BASE}/api/streams`, {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        if (res.status === 401) { redirectLogin(); return; }
        streams = await res.json();
        renderStreamList();
        if (streams.length > 0) playStream(streams[0]);
      } catch (_) {
        console.error('Error loading streams');
      }
    }

    function renderStreamList() {
      const list = document.getElementById('streamList');
      list.innerHTML = '';
      streams.forEach(s => {
        const card = document.createElement('div');
        card.id        = 'card-' + s.id;
        card.className = 'stream-card p-3 mb-2';
        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-semibold">${s.title}</span>
            <span class="badge-live">EN VIVO</span>
          </div>
          <div class="text-secondary small mt-1">${s.description || ''}</div>
        `;
        card.addEventListener('click', () => playStream(s));
        list.appendChild(card);
      });
    }

    // ── Stall detection ────────────────────────────────────────────
    // If the video freezes for 5s without being paused, reload the stream.
    let stallTimer = null;

    function clearStallTimer() {
      clearTimeout(stallTimer);
      stallTimer = null;
    }

    video.addEventListener('waiting', () => {
      if (stallTimer || video.paused) return;
      stallTimer = setTimeout(() => {
        stallTimer = null;
        if (!video.paused && currentStream) playStream(currentStream);
      }, 5000);
    });
    video.addEventListener('playing', clearStallTimer);
    video.addEventListener('ended',   () => { if (currentStream) playStream(currentStream); });

    function playStream(s) {
      clearStallTimer();
      currentStream = s;
      document.getElementById('streamTitle').textContent = s.title;
      document.getElementById('streamDesc').textContent  = s.description || '';

      document.querySelectorAll('.stream-card').forEach(el => el.classList.remove('active'));
      const activeCard = document.getElementById('card-' + s.id);
      if (activeCard) activeCard.classList.add('active');

      if (hls) { hls.destroy(); hls = null; }

      const playlistUrl = `${window.API_BASE}/stream/${s.id}/playlist.m3u8`;

      if (Hls.isSupported()) {
        let mediaRecovering = false;

        hls = new Hls({
          xhrSetup: xhr => xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token')),
          liveSyncDurationCount:       3,
          liveMaxLatencyDurationCount: 5,
          manifestLoadingMaxRetry:     6,
          levelLoadingMaxRetry:        6,
          fragLoadingMaxRetry:         6,
        });
        hls.loadSource(playlistUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          syncMuteUI();
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.response && data.response.code === 401) { redirectLogin(); return; }
          if (!data.fatal) return;

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !mediaRecovering) {
            // First media error: attempt in-place recovery
            mediaRecovering = true;
            hls.recoverMediaError();
          } else {
            // Unrecoverable: reload stream after a brief delay
            setTimeout(() => { if (currentStream) playStream(currentStream); }, 2000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playlistUrl;
        syncMuteUI();
        video.play().catch(() => {});
      }
    }

    function redirectLogin() {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }

    loadStreams();
  </script>
</body>
</html>
