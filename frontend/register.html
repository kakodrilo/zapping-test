<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta - Zapping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .form-control { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    .form-control:focus { background: #0d1117; color: #e6edf3; border-color: #58a6ff; box-shadow: none; }
    .btn-primary { background: #238636; border-color: #238636; }
    .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h4 class="mb-4 text-center">Crear cuenta</h4>
    <div id="alert" class="alert d-none"></div>
    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" id="name" class="form-control" placeholder="Tu nombre" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>
    <hr class="border-secondary" />
    <p class="text-center mb-0 small">
      ¿Ya tenés cuenta? <a href="/login.html" class="text-info">Iniciar sesión</a>
    </p>
  </div>

  <script src="/config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert d-none';

      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${window.API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          alertEl.className = 'alert alert-success';
          alertEl.textContent = 'Cuenta creada. Redirigiendo...';
          setTimeout(() => window.location.href = '/login.html', 1500);
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.error || 'Error al registrar';
        }
      } catch (_) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'Error de conexión';
      }
    });
  </script>
</body>
</html>
