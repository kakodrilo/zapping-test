services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: livestream_gateway
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${APP_PORT:-8080}:8080"
      - "${PMA_PORT:-8081}:8081"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
      - phpmyadmin
    networks:
      - livestream_network
    restart: always

  app:
    build: .
    container_name: livestream_app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - MEDIA_SERVER_URL=${MEDIA_SERVER_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
      nginx:
        condition: service_healthy
    networks:
      - livestream_network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livestream_frontend
    networks:
      - livestream_network
    restart: always

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: livestream_media
    networks:
      - livestream_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/segments/big_bug_bunny/segment.m3u8", "-o", "/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  db:
    image: mysql:8.0
    container_name: livestream_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./database/mysql_data:/var/lib/mysql
      - ./database/init_db:/docker-entrypoint-initdb.d
    networks:
      - livestream_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: livestream_admin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - livestream_network

networks:
  livestream_network:
    driver: bridge
